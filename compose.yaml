# docker compose up --build  →  http://localhost:8000/docs
# 값은 .env에서 읽는다 (cp .env.example .env). .env가 없으면 아래 기본값으로 뜬다
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nurs}
      POSTGRES_USER: ${POSTGRES_USER:-nurs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nurs}
    # 호스트의 5432와 충돌하지 않도록 포트를 열지 않는다. api는 내부 네트워크(postgres:5432)로 접속
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nurs}:${POSTGRES_PASSWORD:-nurs}@postgres:5432/${POSTGRES_DB:-nurs}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}  # 로컬 http. HTTPS 배포에서는 true
      REMINDER_EVERY_SECONDS: ${REMINDER_EVERY_SECONDS:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
