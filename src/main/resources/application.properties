spring.application.name=nurs-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nurs}
spring.datasource.username=${DB_USER:nurs}
spring.datasource.password=${DB_PASSWORD:nurs}
# ponytail: 스키마 자동 갱신. 운영 배포 전 Flyway 마이그레이션으로 전환
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# AUTH-05: 세션 쿠키 (액세스 30분 권장값)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict

# SCH-11 업로드 최대 크기 (🔶 권장값)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
