services:
  api:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: 8000
      WARD_DB_PATH: /data/ward_scheduler.db
      WARD_ALLOWED_ORIGINS: http://localhost:3000
      WARD_SEED_DEMO: "1"
    ports:
      - "8000:8000"
    volumes:
      - ward_data:/data

volumes:
  ward_data:
